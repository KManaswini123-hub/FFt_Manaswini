<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url(./abstract-luxury-gradient-blue-background-smooth-dark-blue-with-black-vignette-studio-banner_1258-54587\ \(1\).avif);
            margin: 0;
            padding: 40px;
        }

        form {
            width: 500px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 250px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input {
            border-color: #4a90e2;
            outline: none;
            box-shadow: 0px 0px 5px rgba(74, 144, 226, 0.5);
        }

        button {
            padding: 10px 25px;
            margin: 15px 5px;
            border: none;
            border-radius: 6px;
            background-color: #4a90e2;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #357abd;
        }

        #para {
            margin-top: 20px;
            padding: 20px;
            background-color: #f5f7fa;
            border-radius: 10px;
            line-height: 1.8;
            color: #333;
        }

        #para h1 {
            color: #4a90e2;
            font-size: 24px;
            border-bottom: 2px solid #4a90e2;
            padding-bottom: 10px;
        }
    </style>
</head>

<body>

    <form>

        <h1>Interactive Student Result Dashboard</h1>

        <label>Student Name:</label>
        <input type="text" name="n1" id="i1">
        <br><br>

        <label>Student Regno:</label>
        <input type="number" name="n2" id="i2">
        <br><br>

        <label>HTML Marks:</label>
        <input type="number" name="n3" id="i3">
        <br><br>

        <label>CSS Marks:</label>
        <input type="number" name="n4" id="i4">
        <br><br>

        <label>JavaScript Marks:</label>
        <input type="number" name="n5" id="i5">
        <br><br>

        <button type="button" onclick="check()">Result</button>
        <button type="reset">Reset</button>

        <p id="para"></p>

    </form>


    <script>

        function check() {

            let n1 = document.getElementById('i1').value;
            let n2 = document.getElementById('i2').value;
            let n3 = Number(document.getElementById('i3').value);
            let n4 = Number(document.getElementById('i4').value);
            let n5 = Number(document.getElementById('i5').value);
            let total = n3 + n4 + n5;
            let average = total / 3;
            let percentage = (total / 300) * 100;
            let grade;

            if (average >= 80) {
                grade = "A";
            }
            else if (average >= 60) {
                grade = "B";
            }
            else if (average >= 40) {
                grade = "C";
            }
            else if (average < 40) {
                grade = "D";
            }
            else {
                grade = "Absent";
            }

            let status;

            if (average >= 40) {
                status = "PASS";
            }
            else {
                status = "FAIL";
            }

            document.getElementById('para').innerHTML =
                "<h1>Student Details</h1>" +
                "Student Name: " + n1 + "<br>" +
                "Student Reg: " + n2 + "<br>" +
                "HTML Marks: " + n3 + "<br>" +
                "CSS Marks: " + n4 + "<br>" +
                "JavaScript Marks: " + n5 + "<br>" +
                "Total Marks: " + total + "<br>" +
                "Average Marks: " + average.toFixed(2) + "<br>" +
                "Percentage: " + percentage.toFixed(2) + "%<br>" +
                "Grade: " + grade + "<br>" +
                "Status: " + status + "<br>";
        }

    </script>

</body>

</html>
